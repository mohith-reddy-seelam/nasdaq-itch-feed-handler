name: ci

on:
  push:
  pull_request:

jobs:
  # C++26 reflection + contracts need GCC 16; the official gcc image has it.
  linux:
    name: linux / ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    container: gcc:16
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan]
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y ninja-build cmake
      - run: cmake --preset ${{ matrix.preset }} -DITCH_NATIVE=OFF
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} -j 2
      # Synthetic feed end to end: generate, replay through the book and the pipeline.
      - if: matrix.preset == 'release'
        run: |
          ./build/release/itch_gen feed.bin --messages=2000000
          ./build/release/itch_replay feed.bin --mode=inline --out=ci
          ./build/release/itch_replay feed.bin --mode=pipeline --cpus=0,1,1 --out=ci-pipe
          test -s ci/summary.json && test -s ci-pipe/latency_summary.csv

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            git
      - run: cmake --preset release -DITCH_NATIVE=OFF
      - run: cmake --build --preset release
      - run: ./build/release/itch_tests.exe
